services:
  mysql:
    image: mysql:9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "#Vinteque2025#"
      MYSQL_DATABASE: "vinteque"
    ports:
      - 3360:3306
    volumes:
      - ./database/mysql:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
    ports:
      - 8081:80
    depends_on:
      - mysql
  
  redis:
    image: redis:8
    restart: unless-stopped

  directus:
    image: directus/directus:11
    restart: unless-stopped
    ports:
      - 8055:8055
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    depends_on:
      - mysql
      - redis
    environment:
      SECRET: "a1b2c3d4e5f6789A0123456789(0123DE456789w0wawbcdef1234567S)890Aabcd#ef123456"

      DB_CLIENT: "mysql"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_DATABASE: "vinteque"
      DB_USER: "root"
      DB_PASSWORD: "#Vinteque2025#"

      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://redis:6379"

      ADMIN_EMAIL: "vinvincent254@gmail.com"
      ADMIN_PASSWORD: "#Vinteque2025#"

      PUBLIC_URL: "http://localhost:8055"