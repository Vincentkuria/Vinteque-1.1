services:
  mysql:
    image: mysql:9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./database/mysql:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_ABSOLUTE_URI=http://new.vinteque.com/phpmyadmin
    ports:
      - 8082:80
    depends_on:
      - mysql
  
  redis:
    image: redis:8
    restart: unless-stopped

  directus:
    image: directus/directus:11
    restart: unless-stopped
    ports:
      - 8055:8055
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    depends_on:
      - mysql
      - redis
    environment:
      SECRET: "a1b2c3d4e5f6789A0123456789(0123DE456789w0wawbcdef1234567S)890Aabcd#ef123456"

      DB_CLIENT: "mysql"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USER: "root"
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://redis:6379"

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      PUBLIC_URL: "http://new.vinteque.com/directus"

  vinteque:
    build: .
    restart: unless-stopped
    ports:
      - 3001:3000
    depends_on:
      - directus